# SonarQube Configuration for Proximity Detector Project
sonar.projectKey=proximity-detector
sonar.projectName=Proximity Detector
sonar.projectVersion=1.0
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.exclusions=test_*.py,**/tests/**
sonar.python.version=3.9
sonar.python.pylint.reportPath=pylint-report.txt
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.bandit.reportPath=bandit-report.json
# sonar.host.url=http://localhost:9000
# sonar.login=your_token_here
